services:
  - type: web
    name: auto-ecommerce-backend
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --extra temporal --frozen
    startCommand: uv run uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_CLICKHOUSE
        value: "false"
      - key: USE_AGENT_FIXTURES
        value: "true"
      - key: USE_TEMPORAL
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: BASE_DOMAIN
        value: fastaisolution.com
      - key: TEMPORAL_TASK_QUEUE
        value: launch-store
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TOKEN_TTL_MINUTES
        value: "10080"
      - key: REQUIRE_AUTH_FOR_RUNS
        value: "true"
      - key: CLICKHOUSE_HOST
        sync: false
      - key: CLICKHOUSE_PORT
        value: "8443"
      - key: CLICKHOUSE_USER
        sync: false
      - key: CLICKHOUSE_PASSWORD
        sync: false
      - key: CLICKHOUSE_DATABASE
        sync: false
      - key: CLICKHOUSE_SECURE
        value: "true"
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "false"
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_LOCATION
        sync: false
      - key: NIMBLE_API_KEY
        sync: false
      - key: NIMBLE_API_URL
        sync: false
      - key: DATADOG_API_KEY
        sync: false
      - key: DATADOG_SITE
        sync: false

  - type: web
    name: auto-ecommerce-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm exec next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NEXT_PUBLIC_USE_MOCKS
        value: "false"
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
