services:
  - type: web
    name: auto-ecommerce-backend
    runtime: python
    plan: free
    buildCommand: uv sync --extra temporal
    startCommand: uv run uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - name: USE_CLICKHOUSE
        value: "false"
      - name: USE_AGENT_FIXTURES
        value: "true"
      - name: USE_TEMPORAL
        value: "false"
      - name: DEMO_MODE
        value: "true"
      - name: BASE_DOMAIN
        value: fastaisolution.com
      - name: TEMPORAL_TASK_QUEUE
        value: launch-store
      - name: AUTH_SECRET
        generateValue: true
      - name: AUTH_TOKEN_TTL_MINUTES
        value: "10080"
      - name: CLICKHOUSE_HOST
        sync: false
      - name: CLICKHOUSE_PORT
        value: "8443"
      - name: CLICKHOUSE_USER
        sync: false
      - name: CLICKHOUSE_PASSWORD
        sync: false
      - name: CLICKHOUSE_DATABASE
        sync: false
      - name: CLICKHOUSE_SECURE
        value: "true"
      - name: GOOGLE_API_KEY
        sync: false
      - name: GOOGLE_GENAI_USE_VERTEXAI
        value: "false"
      - name: GOOGLE_CLOUD_PROJECT
        sync: false
      - name: GOOGLE_CLOUD_LOCATION
        sync: false
      - name: NIMBLE_API_KEY
        sync: false
      - name: DATADOG_API_KEY
        sync: false
      - name: DATADOG_SITE
        sync: false

  - type: web
    name: auto-ecommerce-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm exec next start -H 0.0.0.0 -p $PORT
    envVars:
      - name: NEXT_PUBLIC_USE_MOCKS
        value: "false"
      - name: NEXT_PUBLIC_API_BASE_URL
        sync: false
