# Render blueprint. autoDeploy is disabled on both services while we polish
# the app locally. To turn deployment on later: set `autoDeploy: true` (or
# trigger a manual deploy from the Render dashboard).
services:
  - type: web
    name: auto-ecommerce-backend
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: pip install uv && uv sync --extra temporal --frozen
    startCommand: uv run uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: USE_CLICKHOUSE
        value: "true"
      - key: USE_AGENT_FIXTURES
        value: "true"
      - key: USE_TEMPORAL
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: BASE_DOMAIN
        value: fastaisolution.com
      - key: TEMPORAL_TASK_QUEUE
        value: launch-store
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TOKEN_TTL_MINUTES
        value: "10080"
      - key: REQUIRE_AUTH_FOR_RUNS
        value: "true"
      - key: CLICKHOUSE_HOST
        sync: false
      - key: CLICKHOUSE_PORT
        value: "8443"
      - key: CLICKHOUSE_USER
        sync: false
      - key: CLICKHOUSE_PASSWORD
        sync: false
      - key: CLICKHOUSE_DATABASE
        sync: false
      - key: CLICKHOUSE_SECURE
        value: "true"
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "false"
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_LOCATION
        sync: false
      - key: NIMBLE_API_KEY
        sync: false
      - key: NIMBLE_API_URL
        sync: false
      - key: DATADOG_API_KEY
        sync: false
      - key: DATADOG_SITE
        sync: false

  - type: web
    name: auto-ecommerce-frontend
    runtime: node
    plan: free
    rootDir: frontend
    autoDeploy: false
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm exec next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      - key: NEXT_PUBLIC_USE_MOCKS
        value: "false"
      # Hard-coded backend URL. If the backend service is renamed, update here.
      # Avoid `sync: false` here — without an explicit value the frontend
      # silently boots into mock mode at build time (NEXT_PUBLIC_* is baked
      # into the bundle), which is invisible until users notice fake data.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://auto-ecommerce-backend.onrender.com
