[project]
name = "auto-ecommerce"
version = "0.1.0"
description = "Fixture-first Auto-Ecommerce backend and demo workflow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2",
  "pytest>=8",
  "uvicorn>=0.30",
  "clickhouse-connect>=0.7",
]

[project.optional-dependencies]
temporal = [
  "temporalio[pydantic]>=1.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
