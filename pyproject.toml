[project]
name = "auto-ecommerce"
version = "0.1.0"
description = "AI swarm that autonomously launches niche e-commerce stores"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2",
  "pytest>=8",
  "uvicorn>=0.30",
  "clickhouse-connect>=0.7",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
temporal = [
  "temporalio[pydantic]>=1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv]
package = false
