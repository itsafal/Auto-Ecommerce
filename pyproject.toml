[project]
name = "auto-ecommerce"
version = "0.1.0"
description = "AI swarm that autonomously launches niche e-commerce stores"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=0.7.0",
    "datadog>=0.49.0",
    "ddtrace>=2.10.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv]
package = false
